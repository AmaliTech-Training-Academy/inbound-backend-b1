name: Cleanup Docker Images

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Inbound-Server-deployment-Pipeline"]
    types:
      - completed
    branches:
    #   - main
      - dev

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup Docker images on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_KEY }}
            script: |
              CURRENT_IMAGE=$(docker inspect $(docker compose -f /opt/inbound-backend-b1/docker-compose.yml ps -q my_service) --format '{{.Image}}')

              docker images inbound-api --format '{{.ID}} {{.CreatedAt}}' \
                | sort -k2,3,4,5 -r \
                | awk '{print $1}' \
                | tail -n +2 \
                | while read IMAGE_ID; do
                    if [ "$IMAGE_ID" != "$CURRENT_IMAGE" ]; then
                      echo "Removing old image: $IMAGE_ID"
                      docker rmi "$IMAGE_ID" || true
                    fi
                  done