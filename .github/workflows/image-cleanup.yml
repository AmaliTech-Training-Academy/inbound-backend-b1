name: ECR Image Cleanup

on:
  workflow_run:
    workflows:
      - Inbound-Server-deployment-Pipeline
    types:
      - completed

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: inbound-api

jobs:
  cleanup:
    name: Clean Old ECR Images
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Clean old images
        run: |
          IMAGES=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'sort_by(imageDetails,&imagePushedAt)[:-5].imageDigest' \
            --output text)

          if [ -n "$IMAGES" ] && [ "$IMAGES" != "None" ]; then
            for IMAGE in $IMAGES; do
              aws ecr batch-delete-image \
                --repository-name $ECR_REPOSITORY \
                --image-ids imageDigest=$IMAGE
            done
          else
            echo "No old images to clean."
          fi