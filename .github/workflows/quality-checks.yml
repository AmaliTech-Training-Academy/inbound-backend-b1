name: Backend Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find src -name "*.js" -print0 | xargs -0 -r -n1 node --check

      - name: Validate Prisma schema
        run: npx prisma validate --schema=./src/api/v1/prisma/schema.prisma

      - name: Check Prisma formatting
        run: npx prisma format --schema=./src/api/v1/prisma/schema.prisma --check