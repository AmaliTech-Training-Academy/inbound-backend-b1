name: Inbound-Server-deployment-Pipeline


on:
  push:
    branches:
      - dev
      - feat/devops-deployment
permissions:
  id-token: write 
  contents: read
jobs:
    ci:
        name: Code Quality Checks
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: npm

          - name: Install dependencies
            run: npm ci

          - name: Check JavaScript syntax
            run: |
              find src -name "*.js" -print0 | xargs -0 -r -n1 node --check

          - name: Validate Prisma schema
            run: npx prisma validate --schema=./src/api/v1/prisma/schema.prisma

          - name: Check Prisma formatting
            run: npx prisma format --schema=./src/api/v1/prisma/schema.prisma --check 
    deploy:
      name: Build, Push to ECR and Deploy to ECS
      runs-on: ubuntu-latest
      needs: ci
      concurrency:
        group: deploy-dev
        cancel-in-progress: false

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Install dependencies
          run: npm ci

        - name: Run tests
          run: npm test

        - name: Configure AWS Credentials 
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with:
            audience: sts.amazonaws.com.cn
            aws-region: eu-west-1
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}


        - name: Login to ECR
          id: ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Docker image
          env:
            IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          run: docker build -t "$IMAGE" .

        - name: Push Docker image
          env:
            IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          run: docker push "$IMAGE"

        - name: Download current task definition
          run: |
            aws ecs describe-task-definition \
              --task-definition inbound-api \
              --query taskDefinition > task-definition.json

        - name: Render new task definition revision
          id: task-def
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-definition.json
            container-name: inbound-api
            image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        - name: Deploy to ECS
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.task-def.outputs.task-definition }}
            service: inbound-api
            cluster: inbound-cluster
            wait-for-service-stability: true
        
