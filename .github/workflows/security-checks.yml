name: Backend Security

on:
  push:
    branches: [main, dev,feat/github-actions] #remove the temp feat/github-actions branch after the PR is merged
  # pull_request:
  #   branches: [main, dev,feat/github-actions]
     #remove the temp feat/github-actions branch after the PR is merged

permissions:
  contents: read

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}